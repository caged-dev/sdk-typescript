name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag names the release; package.json and src/version.ts declare the
      # version. If they disagree, that is a mistake to stop on, not to paper
      # over: the job used to run `npm version` to force package.json to match
      # the tag, producing an artifact whose version belongs to no commit.
      # That is the shape of how 0.2.0 shipped 0.1.0's code under a new
      # number, with a User-Agent that still said 0.1.0.
      - name: Check the tag matches the source
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # Nothing is published that has not passed the same gates as a PR.
      # `pnpm test` here also asserts src/version.ts agrees with package.json.
      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Inspect the artifact
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          pnpm verify-tarball "${TAG#v}"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
